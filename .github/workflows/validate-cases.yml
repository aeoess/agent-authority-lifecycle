name: validate-cases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate case catalog
        run: python3 scripts/validate_cases.py
      - name: Check the generated Markdown matches cases.json
        run: python3 scripts/build_cases_md.py --check
      - name: Check every internal Markdown link resolves
        run: python3 scripts/check_links.py
